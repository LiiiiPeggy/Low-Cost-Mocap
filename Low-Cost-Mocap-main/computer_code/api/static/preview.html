<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>双路红外相机预览 · Low-Cost-Mocap</title>
<style>
  :root {
    --bg: #ffffff; --panel: #ffffff; --line: #e3e7ec; --fg: #1f2328;
    --dim: #6b7280; --ok: #16a34a; --warn: #d97706; --err: #dc2626; --accent: #2563eb;
    --view: #10131a;   /* 画面区底色：深色，衬托灰度红外图 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: #fff;
    box-shadow: 0 1px 3px rgba(16, 24, 40, .04);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .meta { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  button {
    background: #fff; color: var(--fg); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px;
    transition: border-color .15s, color .15s, background .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  button.danger { background: #fff; border-color: #f3c2c2; color: var(--err); }
  button.danger:hover:not(:disabled) { background: #fef2f2; border-color: var(--err); color: var(--err); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 20px 28px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
  }
  .panel .head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fbfcfd;
  }
  .panel .head b { font-size: 14px; }
  .panel .head .tag {
    font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; background: #fff;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c3c9d4; display: inline-block; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(22, 163, 74, .16); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(217, 119, 6, .14); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px rgba(220, 38, 38, .14); }
  .view {
    position: relative; background: var(--view); aspect-ratio: 16 / 9;
    display: flex; align-items: center; justify-content: center;
  }
  .view img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .view .hint {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #9aa3b2; font-size: 13px; text-align: center;
    padding: 0 16px; white-space: pre-wrap;
  }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px;
    background: #fff;
  }
  .stats div span { display: block; color: var(--dim); font-size: 11px; }
  .stats div b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg); }
  .err-msg { padding: 0 14px 10px; color: var(--err); font-size: 12px; word-break: break-all; background: #fff; }
  .err-msg:empty { padding: 0; }
  #log {
    margin: 0 20px 24px; padding: 10px 14px; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; color: #4b5563; font: 12px/1.7 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; max-height: 150px; overflow: auto;
  }
  /* ---- 帧同步状态条 ---- */
  #syncbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 9px 20px; background: #f8fafc; border-bottom: 1px solid var(--line);
    font-size: 12.5px; color: var(--dim);
  }
  #syncbar > b { color: var(--fg); font-size: 13px; }
  #syncbar b { color: var(--fg); font-variant-numeric: tabular-nums; }
  #syncbar .note { color: #98a1b0; font-size: 11px; }
  #syncbar label { display: inline-flex; align-items: center; gap: 5px; }
  #syncbar input[type="number"] {
    width: 58px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px;
    font-size: 12px; color: var(--fg); background: #fff; font-variant-numeric: tabular-nums;
  }
  #syncbar button { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  #syncbar .pill {
    font-size: 11px; padding: 1px 6px; border-radius: 999px;
    background: #eef2f7; color: #51607a; border: 1px solid #e3e9f1;
  }
  /* ---- 标定区块 ---- */
  #calib { border-bottom: 1px solid var(--line); background: #fbfcfd; }
  #calib .bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 9px 20px; font-size: 12.5px; color: var(--dim);
  }
  #calib .bar > b { color: var(--fg); font-size: 13px; }
  #calib .bar b { color: var(--fg); font-variant-numeric: tabular-nums; }
  #calib .bar label { display: inline-flex; align-items: center; gap: 5px; }
  #calib input[type="number"] {
    width: 60px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px;
    font-size: 12px; color: var(--fg); background: #fff; font-variant-numeric: tabular-nums;
  }
  #calib button { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  #calib .body { padding: 0 20px 14px; }
  #calib.collapsed .body { display: none; }
  #calib .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 5px 0; }
  #calib .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  #calib .live { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  @media (max-width: 900px) { #calib .live { grid-template-columns: 1fr; } }
  #calib .live figure {
    margin: 0; position: relative; background: var(--view);
    border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9;
  }
  #calib .live img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #calib .live figcaption {
    position: absolute; left: 8px; top: 6px; color: #cbd5e1; font-size: 11px;
    background: rgba(16,19,26,.55); padding: 1px 6px; border-radius: 4px;
  }
  #calib .out {
    margin-top: 8px; font: 12px/1.65 ui-monospace, Consolas, monospace; color: #374151;
    white-space: pre-wrap; max-height: 240px; overflow: auto; background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  #calib .badge {
    font-size: 11px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid #e3e9f1; background: #eef2f7; color: #51607a;
  }
  #calib .badge.ok { background: #ecfdf5; border-color: #bbf7d0; color: #15803d; }
  #calib .badge.err { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  #c-map {
    width: 100%; max-width: 680px; height: auto; display: block; margin-top: 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
  }
  #calib .hintline { color: #98a1b0; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>双路红外相机预览</h1>
  <span class="meta" id="summary">连接中…</span>
  <span class="meta" id="build"></span>
  <span class="spacer"></span>
  <button id="btn-start" class="primary">启动采集</button>
  <button id="btn-stop" class="danger">停止采集</button>
  <button id="btn-save">保存原始灰度</button>
  <button id="btn-calib">标定面板</button>
</header>

<section id="syncbar">
  <b>帧同步</b>
  <span class="pill">软件级 · 主机单调时钟</span>
  <label>阈值 <input id="maxdt" type="number" min="1" max="200" step="1" value="20"> ms</label>
  <span>配对率 <b id="s-rate">—</b></span>
  <span>|Δt| 均值 <b id="s-mean">—</b></span>
  <span>P95 <b id="s-p95">—</b></span>
  <span>最大 <b id="s-max">—</b></span>
  <span>丢弃 <b id="s-drop">—</b></span>
  <span>缓存 <b id="s-buf">—</b></span>
  <span class="spacer"></span>
  <span class="note">Δt 为帧交付时刻差，非曝光中心时刻</span>
  <button id="btn-sync-save">保存同步对</button>
</section>

<main id="panels"></main>
<div id="log">等待操作…</div>

<!-- ===================== 标定面板 ===================== -->
<section id="calib" class="collapsed">
  <div class="bar">
    <b>标定</b>
    <span class="pill">内参 + 双目外参 · OpenCV</span>
    <label>内角点 <input id="c-cols" type="number" min="3" max="20" value="11"> ×
      <input id="c-rows" type="number" min="3" max="20" value="8"></label>
    <label>方格 <input id="c-sq" type="number" min="1" step="0.5" value="30"> mm</label>
    <label>板面高 <input id="c-sqh" type="number" min="0" step="1" value="0"> mm</label>
    <button id="c-open" class="primary">新建 / 打开会话</button>
    <span id="c-sess" class="badge">未打开会话</span>
    <span class="spacer"></span>
    <label><input type="checkbox" id="c-live"> 实时检测叠加</label>
    <button id="c-collapse">收起</button>
  </div>
  <div class="body">
    <div class="row">
      <span>相机 0 有效 <b id="c-n0">0</b></span>
      <button data-cap="0">采集相机 0</button>
      <span class="sep"></span>
      <span>相机 1 有效 <b id="c-n1">0</b></span>
      <button data-cap="1">采集相机 1</button>
      <span class="sep"></span>
      <span>同步帧对有效 <b id="c-np">0</b></span>
      <button id="c-cap-pair" class="primary">采集同步帧对</button>
      <span class="spacer"></span>
      <button id="c-clear" class="danger">清空样本</button>
    </div>
    <div class="row">
      <button id="c-intr">内参标定</button>
      <button id="c-stereo">外参标定（双目标定）</button>
      <button id="c-valid">独立验证（留出集）</button>
      <button id="c-view">查看结果</button>
      <button id="c-cover">覆盖检查</button>
      <button id="c-save" class="primary">保存 calibration.json</button>
      <span class="spacer"></span>
      <span id="c-intr-tag" class="badge">内参 —</span>
      <span id="c-stereo-tag" class="badge">外参 —</span>
    </div>
    <div class="row" style="border-top:1px dashed var(--line); margin-top:4px; padding-top:8px">
      <b>世界系外参</b>
      <span class="hintline">固定板 · solvePnP</span>
      <button id="c-ex0">采外参图 相机0</button>
      <button id="c-ex1">采外参图 相机1</button>
      <span>帧数 <b id="c-nx0">0</b> / <b id="c-nx1">0</b></span>
      <button id="c-solex" class="primary">解外参 solvePnP</button>
      <label><input type="checkbox" id="c-flip"> 全局翻转 180°</label>
      <span class="sep"></span>
      <label><input type="checkbox" id="c-axes"> 世界轴叠加</label>
      <button id="c-valrig">独立验证（多位置）</button>
      <span id="c-extag" class="badge">外参 —</span>
    </div>
    <div class="live">
      <figure><img id="c-img0" alt="cam0 detection"><figcaption>相机 0 检测</figcaption></figure>
      <figure><img id="c-img1" alt="cam1 detection"><figcaption>相机 1 检测</figcaption></figure>
    </div>
    <canvas id="c-map" width="680" height="380"></canvas>
    <div id="c-out">标定面板：先「新建 / 打开会话」，再用标定板在各姿态下依次「采集」。</div>
  </div>
</section>

<script>
const CAMERAS = [0, 1];
let running = false;
let timer = null;

const el = (id) => document.getElementById(id);
const panelsEl = el('panels');
const logEl = el('log');
const summaryEl = el('summary');

// 每路相机的显示状态
const mode = {};       // index -> 'mjpeg' | 'poll'
const seen = {};       // index -> 是否已收到过至少一帧
const pollTimer = {};  // index -> setInterval id
const pollUrl = {};    // index -> 当前 objectURL

function log(msg) {
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
}

function buildPanels() {
  panelsEl.innerHTML = CAMERAS.map(i => `
    <section class="panel" data-cam="${i}">
      <div class="head">
        <span class="dot" id="dot-${i}"></span>
        <b>相机 ${i}</b>
        <span class="meta" id="fmt-${i}">—</span>
        <span class="spacer"></span>
        <span class="tag" id="mode-${i}">—</span>
      </div>
      <div class="view">
        <span class="hint" id="hint-${i}">等待采集…</span>
        <img id="img-${i}" alt="camera ${i}" style="display:none" />
      </div>
      <div class="stats">
        <div><span>分辨率</span><b id="res-${i}">—</b></div>
        <div><span>实际 FPS</span><b id="fps-${i}">—</b></div>
        <div><span>帧号</span><b id="seq-${i}">—</b></div>
        <div><span>滞后</span><b id="lag-${i}">—</b></div>
      </div>
      <div class="err-msg" id="err-${i}"></div>
    </section>`).join('');
}
buildPanels();

// 默认同源；若页面被外层代理/iframe 包裹导致相对路径打不到后端，自动直连 3002
let API_BASE = '';
const DIRECT_BASE = 'http://127.0.0.1:3002';
const apiUrl = (p) => API_BASE + p;

async function _getJson(path, opts) {
  const r = await fetch(apiUrl(path), opts);
  const txt = await r.text();
  let data = {};
  try { data = JSON.parse(txt); } catch (e) { data = { error: txt }; }
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

async function api(path, opts) {
  try {
    return await _getJson(path, opts);
  } catch (e) {
    if (API_BASE === '' && location.port !== '3002') {
      API_BASE = DIRECT_BASE;
      log('同源接口不可达，改用 ' + DIRECT_BASE);
      return await _getJson(path, opts);
    }
    throw e;
  }
}

// ---------- 显示通道：优先 MJPEG，不通则降级为快照轮询 ----------
function stopChannel(i, hintText) {
  if (pollTimer[i]) { clearInterval(pollTimer[i]); delete pollTimer[i]; }
  if (pollUrl[i]) { URL.revokeObjectURL(pollUrl[i]); delete pollUrl[i]; }
  const img = el(`img-${i}`);
  if (img) {
    img.onload = null;
    img.onerror = null;
    img.removeAttribute('src');
    img.style.display = 'none';
  }
  delete mode[i];
  seen[i] = false;
  const tag = el(`mode-${i}`);
  if (tag) tag.textContent = '—';
  const hint = el(`hint-${i}`);
  if (hint) {
    hint.style.display = 'flex';
    hint.textContent = hintText || '已停止';
  }
}

function startPoll(i) {
  if (mode[i] === 'poll') return;
  const img = el(`img-${i}`);
  if (mode[i] === 'mjpeg') {          // 从 MJPEG 切过来：先断开长连接
    img.onload = null;
    img.onerror = null;
    img.removeAttribute('src');
  }
  mode[i] = 'poll';
  const tag = el(`mode-${i}`);
  if (tag) tag.textContent = '快照轮询';

  let inflight = false;
  const tick = async () => {
    if (inflight) return;             // 上一帧没回来就跳过，避免请求堆积
    inflight = true;
    try {
      const r = await fetch(apiUrl(`/api/camera/${i}/snapshot?t=${Date.now()}`), { cache: 'no-store' });
      if (r.ok) {
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const old = pollUrl[i];
        img.src = url;
        pollUrl[i] = url;
        // 延迟释放，避免当前显示的帧被立刻回收
        if (old) setTimeout(() => URL.revokeObjectURL(old), 800);
        img.style.display = 'block';
        const hint = el(`hint-${i}`);
        if (hint) hint.style.display = 'none';
        seen[i] = true;
      }
    } catch (e) { /* 网络抖动，下一轮再试 */ }
    finally { inflight = false; }
  };
  pollTimer[i] = setInterval(tick, 110);   // ≈9 fps
  tick();
}

function startMjpeg(i) {
  if (mode[i]) return;
  mode[i] = 'mjpeg';
  const img = el(`img-${i}`);
  const hint = el(`hint-${i}`);
  const tag = el(`mode-${i}`);
  if (tag) tag.textContent = 'MJPEG';
  img.style.display = 'block';
  if (hint) hint.style.display = 'none';
  img.onload = () => { seen[i] = true; };          // multipart 首帧到达
  img.onerror = () => {
    if (mode[i] === 'mjpeg') {
      log(`相机 ${i}：MJPEG 流不可用，改用快照轮询`);
      startPoll(i);
    }
  };
  img.src = apiUrl(`/api/camera/${i}/stream?k=${Date.now()}`);

  // 某些内嵌浏览器不报错也不渲染 multipart，超时后自动降级
  setTimeout(() => {
    if (mode[i] === 'mjpeg' && !seen[i]) {
      log(`相机 ${i}：3.5s 未收到 MJPEG 帧，改用快照轮询`);
      startPoll(i);
    }
  }, 3500);
}

// ---------- 帧同步状态 ----------
function fmtNum(v, unit, digits) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  return v.toFixed(digits === undefined ? 1 : digits) + (unit || '');
}

async function refreshSync() {
  try {
    const s = await api('/api/sync/status');
    el('s-rate').textContent = s.pair_rate === null ? '—'
      : (s.pair_rate * 100).toFixed(0) + '%';
    el('s-mean').textContent = fmtNum(s.dt_ms.mean, ' ms');
    el('s-p95').textContent = fmtNum(s.dt_ms.p95, ' ms');
    el('s-max').textContent = fmtNum(s.dt_ms.max, ' ms');
    el('s-drop').textContent = `${s.dropped.a} / ${s.dropped.b}`;
    el('s-buf').textContent = `${s.buffered.a} / ${s.buffered.b}`;
    // 用户正在输入时不要覆盖输入框
    if (document.activeElement !== el('maxdt')) el('maxdt').value = s.max_dt_ms;
  } catch (e) {
    ['s-rate', 's-mean', 's-p95', 's-max'].forEach(id => { el(id).textContent = '—'; });
    el('s-drop').textContent = '—';
    el('s-buf').textContent = '—';
  }
}

// ---------- 状态轮询：由它决定每路挂不挂流 ----------
async function refresh() {
  try {
    const st = await api('/api/cameras');
    const now = Date.now() / 1000;
    const live = st.cameras.filter(c => c.state === 'streaming').length;
    const want = (st.defaults && st.defaults.indices ? st.defaults.indices : CAMERAS).length;
    summaryEl.textContent = `在线 ${live}/${st.count} 路 · ${new Date(st.server_time * 1000).toLocaleTimeString('zh-CN', { hour12: false })}`;

    st.cameras.forEach(c => {
      const i = c.index;
      if (!el(`img-${i}`)) return;   // 面板里没有这一路（索引不在 CAMERAS），忽略
      const dot = el(`dot-${i}`);
      if (dot) dot.className = 'dot ' + (c.state === 'streaming' ? 'ok' : (c.state === 'error' ? 'err' : 'warn'));
      const fmt = el(`fmt-${i}`);
      if (fmt) fmt.textContent = c.format || c.state;
      const err = el(`err-${i}`);
      if (err) err.textContent = c.error || '';

      const f = c.frame;
      if (f) {
        el(`res-${i}`).textContent = `${f.width}×${f.height}`;
        el(`seq-${i}`).textContent = f.seq;
        el(`lag-${i}`).textContent = `${Math.max(0, (now - f.host_timestamp) * 1000).toFixed(0)} ms`;
      }
      el(`fps-${i}`).textContent = c.fps ? c.fps.toFixed(1) : '0';

      // 关键：只要相机在推流，就自动把画面挂上去（不再依赖点击按钮）
      if (c.state === 'streaming') {
        if (!mode[i]) startMjpeg(i);
      } else if (mode[i]) {
        stopChannel(i, c.state === 'error' ? '采集异常，见下方错误信息'
                        : (c.state === 'reconnecting' ? '断线重连中…' : '已停止'));
      } else {
        const hint = el(`hint-${i}`);
        if (hint) {
          hint.style.display = 'flex';
          hint.textContent = c.state === 'error' ? '采集异常'
                            : (c.state === 'opening' ? '正在打开设备…'
                            : (c.state === 'stopped' ? '已停止' : '等待采集…'));
        }
      }
    });

    // 后端没有报上来的相机（未启动）
    const reported = new Set(st.cameras.map(c => c.index));
    CAMERAS.forEach(i => {
      if (!reported.has(i)) {
        const dot = el(`dot-${i}`); if (dot) dot.className = 'dot';
        const fmt = el(`fmt-${i}`); if (fmt) fmt.textContent = '未启动';
        const hint = el(`hint-${i}`);
        if (hint) { hint.style.display = 'flex'; hint.textContent = '这台相机未启动'; }
      }
    });

    const states = st.cameras.map(c => c.state);
    running = states.includes('streaming') || states.includes('opening') || states.includes('reconnecting');
    el('btn-start').disabled = running;
    el('btn-stop').disabled = !running;
  } catch (e) {
    summaryEl.textContent = '后端未连接：' + e.message;
    CAMERAS.forEach(i => stopChannel(i, '后端未连接\n' + e.message));
  }
  await refreshSync();
}

// ---- 实时检测叠加 ----
function startCalibLive() {
  if (cLiveTimer) return;
  const tick = async () => {
    if (cLiveBusy) return;
    cLiveBusy = true;
    try {
      for (const cam of CAMERAS) {
        const img = el('c-img' + cam);
        if (!img) continue;
        const axes = el('c-axes').checked;
        const flip = el('c-flip').checked ? 1 : 0;
        const qs = `camera=${cam}&scale=0.55&t=${Date.now()}`;
        const feed = axes ? `/api/calib/extrinsic/overlay?${qs}&flip180=${flip}`
                          : `/api/calib/live?${qs}`;
        let r = await fetch(apiUrl(feed), { cache: 'no-store' });
        if (!r.ok && axes) {          // 没内参时退回普通检测叠加
          r = await fetch(apiUrl(`/api/calib/live?${qs}`), { cache: 'no-store' });
        }
        if (!r.ok) { img.removeAttribute('src'); continue; }
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const old = cLiveUrl[cam];
        img.src = url;
        cLiveUrl[cam] = url;
        if (old) setTimeout(() => URL.revokeObjectURL(old), 700);
      }
    } catch (e) { /* 相机没开就静默 */ }
    finally { cLiveBusy = false; }
  };
  cLiveTimer = setInterval(tick, 900);
  tick();
}

function stopCalibLive() {
  if (cLiveTimer) { clearInterval(cLiveTimer); cLiveTimer = null; }
  CAMERAS.forEach(c => {
    const img = el('c-img' + c);
    if (img) img.removeAttribute('src');
  });
}

el('c-live').onchange = () => {
  if (el('c-live').checked) {
    cLog('开启实时检测叠加（每 0.9s 检测一次，会占用一些 CPU）');
    startCalibLive();
  } else stopCalibLive();
};

// ---- 相机位姿俯视图（世界 X-Y 平面，Z 向上）----
function drawMap(st) {
  const cv = el('c-map');
  if (!cv) return;
  const g = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);

  const ex = st && st.extrinsic;
  const sess = st && st.session;
  const wf = (sess && sess.board && sess.board.world_frame) || null;
  const bw = (wf && wf.board_extent_x_m) || 0.36;
  const bh = (wf && wf.board_extent_y_m) || 0.27;

  const xs = [-bw / 2, bw / 2], ys = [-bh / 2, bh / 2];
  const cams = [];
  if (ex && ex.cameras) {
    Object.entries(ex.cameras).forEach(([k, c]) => {
      const pos = c.centre_m || [0, 0, 0];
      cams.push({ k, x: pos[0], y: pos[1], z: pos[2], ax: c.optical_axis || [0, 0, -1],
                  rms: c.reprojection_rms_px, corr: c.correspondence,
                  h: c.height_above_floor_m });
      xs.push(pos[0]); ys.push(pos[1]);
    });
  }
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(maxX - minX, 0.6), spanY = Math.max(maxY - minY, 0.6);
  const pad = 52;
  const sc = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const toC = (x, y) => [W / 2 + (x - cx) * sc, H / 2 - (y - cy) * sc];

  // 1m 网格
  g.strokeStyle = '#f0f3f7'; g.lineWidth = 1;
  const step = 0.5;
  const gx0 = Math.floor(minX / step) * step, gx1 = Math.ceil(maxX / step) * step;
  const gy0 = Math.floor(minY / step) * step, gy1 = Math.ceil(maxY / step) * step;
  for (let x = gx0; x <= gx1 + 1e-9; x += step) {
    const a = toC(x, gy0), b = toC(x, gy1);
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  for (let y = gy0; y <= gy1 + 1e-9; y += step) {
    const a = toC(gx0, y), b = toC(gx1, y);
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }

  // 标定板
  const p0 = toC(-bw / 2, -bh / 2), p1 = toC(bw / 2, bh / 2);
  g.fillStyle = '#eef2f7'; g.strokeStyle = '#9aa3b2'; g.lineWidth = 1.5;
  g.fillRect(p0[0], p1[1], p1[0] - p0[0], p0[1] - p1[1]);
  g.strokeRect(p0[0], p1[1], p1[0] - p0[0], p0[1] - p1[1]);
  // 板内 12×9 方格纹理示意
  g.strokeStyle = '#dfe6ee'; g.lineWidth = 0.6;
  for (let i = 1; i < 12; i++) {
    const x = -bw / 2 + (bw / 12) * i;
    const a = toC(x, -bh / 2), b = toC(x, bh / 2);
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  for (let j = 1; j < 9; j++) {
    const y = -bh / 2 + (bh / 9) * j;
    const a = toC(-bw / 2, y), b = toC(bw / 2, y);
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }

  // 世界原点 + X/Y 轴
  const o = toC(0, 0);
  const axl = Math.max(bw, bh) * 0.55;
  [[axl, 0, '#dc2626', 'X'], [0, axl, '#16a34a', 'Y']].forEach(([dx, dy, col, nm]) => {
    const q = toC(dx, dy);
    g.strokeStyle = col; g.lineWidth = 2;
    g.beginPath(); g.moveTo(o[0], o[1]); g.lineTo(q[0], q[1]); g.stroke();
    g.fillStyle = col; g.font = '600 12px Consolas, monospace';
    g.fillText(nm, q[0] + 4, q[1] - 4);
  });
  g.fillStyle = '#eab308';
  g.beginPath(); g.arc(o[0], o[1], 4, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#6b7280'; g.font = '11px Consolas, monospace';
  g.fillText('O', o[0] + 6, o[1] + 14);

  // 基线
  if (cams.length === 2) {
    const a = toC(cams[0].x, cams[0].y), b = toC(cams[1].x, cams[1].y);
    g.strokeStyle = '#94a3b8'; g.setLineDash([5, 4]); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    g.setLineDash([]);
    if (ex.baseline_m) {
      g.fillStyle = '#64748b'; g.font = '11px Consolas, monospace';
      g.fillText((ex.baseline_m * 1000).toFixed(0) + ' mm',
                 (a[0] + b[0]) / 2 + 6, (a[1] + b[1]) / 2 - 6);
    }
  }

  // 相机：三角形指向光轴在 X-Y 上的投影
  cams.forEach((c) => {
    const p = toC(c.x, c.y);
    let dx = c.ax[0], dy = c.ax[1];
    const n = Math.hypot(dx, dy) || 1;
    dx /= n; dy /= n;
    const ang = Math.atan2(-dy, dx);         // 画布 y 向下
    g.save();
    g.translate(p[0], p[1]); g.rotate(ang);
    g.fillStyle = c.k === '0' ? '#2563eb' : '#7c3aed';
    g.beginPath(); g.moveTo(12, 0); g.lineTo(-8, 7); g.lineTo(-8, -7); g.closePath(); g.fill();
    g.restore();
    g.fillStyle = '#1f2328'; g.font = '600 12px Consolas, monospace';
    g.fillText('cam' + c.k + '  z=' + (c.h || 0).toFixed(2) + 'm', p[0] + 12, p[1] - 8);
    if (c.rms != null) {
      g.fillStyle = '#6b7280'; g.font = '10px Consolas, monospace';
      g.fillText(c.rms.toFixed(3) + 'px', p[0] + 12, p[1] + 4);
    }
  });

  // 图例
  g.fillStyle = '#6b7280'; g.font = '11px Microsoft YaHei, sans-serif';
  g.fillText('俯视 X-Y 平面（Z 向上）· 0.5 m 网格', 10, H - 10);
  if (!ex) {
    g.fillStyle = '#b45309'; g.font = '12px Microsoft YaHei, sans-serif';
    g.fillText('尚未解出外参：先采固定板图像并点「解外参 solvePnP」', 10, 18);
  }
}


async function refreshCalib() {
  try {
    const st = await api('/api/calib/status');
    const s = st.session;
    const tag = el('c-sess');
    if (!s) {
      tag.textContent = '未打开会话';
      tag.className = 'badge';
    } else {
      tag.textContent = `${s.board.cols}×${s.board.rows} @ ${s.board.square_mm}mm · `
                      + `${s.stats.total} 样本 · ${s.stats.stereo_valid} 帧对`;
      tag.className = 'badge ok';
      el('c-n0').textContent = (s.stats.single_valid['0'] || 0);
      el('c-n1').textContent = (s.stats.single_valid['1'] || 0);
      el('c-np').textContent = s.stats.stereo_valid;
      const byp = s.stats.by_phase || {};
      el('c-nx0').textContent = ((byp.extrinsic || {})['0'] || 0);
      el('c-nx1').textContent = ((byp.extrinsic || {})['1'] || 0);
    }
    const i0 = st.intrinsics && st.intrinsics['0'];
    const i1 = st.intrinsics && st.intrinsics['1'];
    const it = el('c-intr-tag');
    it.textContent = (i0 && i1)
      ? `内参 RMS ${i0.rms_px} / ${i1.rms_px}px`
      : (i0 ? `内参 仅相机0 (${i0.rms_px}px)` : '内参 —');
    it.className = 'badge ' + (i0 && i1 ? 'ok' : (i0 || i1 ? '' : ''));

    const ex = st.stereo;
    const etg = el('c-stereo-tag');
    etg.textContent = ex
      ? `双目标定 ${(ex.baseline_m * 1000).toFixed(1)}mm · ${ex.rms_px}px`
      : '双目标定 —';
    etg.className = 'badge ' + (ex ? 'ok' : '');

    const exr = st.extrinsic;
    const xtag = el('c-extag');
    if (exr) {
      xtag.textContent = `外参 基线 ${(exr.baseline_m * 1000).toFixed(1)}mm · `
                       + `自洽 ${(exr.consistency_max_mm).toFixed(1)}mm`;
      xtag.className = 'badge ok';
    } else {
      xtag.textContent = '外参 —';
      xtag.className = 'badge';
    }
    drawMap(st);
  } catch (e) { /* 后端未连上时不打扰主界面 */ drawMap(null); }
}

setInterval(refreshCalib, 2000);
refreshCalib();

window.addEventListener('beforeunload', () => stopCalibLive());
</script>
